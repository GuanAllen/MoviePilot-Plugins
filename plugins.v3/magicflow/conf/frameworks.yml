# ─────────────────────────────────────────────────────────────────────────
# API 通道表（3.45.0）——「带 API 鉴权的站」怎么调，全部外置
#   铁律：采集层只认这张表；代码里不许再写站点专属的 URL / 认证头。
#   * markers：域名/URL/站名里命中任一即归本通道（小写子串）
#   * base：API 根地址模板，可用 {domain} {site_url}
#   * auth：header=认证头名，field=站点记录里取值的字段，prefix=前缀（可空）
#   * envelope：判定业务成功的字段/值（mteam: code=="0"；yemapt: success==true）
#   * endpoints：逻辑名 → 路径（+ param=该端点要的 ID 参数名）
#   * body：默认提交形态 json | form（端点可覆盖）
#   * dl_url：下载凭证 → 直链模板；留空表示端点直接返回直链
api_channels:
  mteam:
    markers:
      - m-team
      - mteam
    base: https://api.{domain}/api
    auth:
      header: x-api-key
      field: apikey
      prefix: ""
    envelope:
      ok_field: code
      ok_value: "0"
      err_field: message
    body: json          # 端点级覆盖见下（mteam 两种形态混用，历史原因）
    endpoints:
      profile:
        path: /member/profile
        body: json
      search:
        path: /torrent/search
        body: json
      detail:
        path: /torrent/detail
        body: form
        param: id
      dl:
        path: /torrent/genDlToken
        body: form
        param: id
    # ★ 5.8.0：馒头没有「网页考核区块」这类可抓的结构，但官方新人考核标准是**固定阈值**
    #   （wiki 帳號規則：上傳>30G、下載>15G、做種獲得魔力>6000，注册后 30 天；任一不达标=禁用）
    #   数据全部来自**官方 API 白名单** `/member/profile` → 合规，不读网页会话。
    exam_rule:
      name: 新手考核
      window_days: 30
      metrics:
        - label: 上传量
          field: upload
          target: 32212254720          # 30 GiB
          target_h: 30 GB
        - label: 下载量
          field: download
          target: 16106127360          # 15 GiB
          target_h: 15 GB
        - label: 魔力值
          field: bonus
          target: 6000
          target_h: 6000
          unit: point
      guard:
        label: 分享率安全线
        field: ratio
        min: 0.3
        when_field: download
        when_gt: 10737418240           # 下载 > 10 GiB 且分享率 < 0.3 → 立即禁用（无宽限）
        hint: "≥0.3"
  yemapt:
    markers:
      - yemapt
    base: https://www.yemapt.org/openApi
    auth:
      header: Authorization
      field: apikey
      prefix: ""
    envelope:
      ok_field: success
      ok_value: true
      err_field: errorMessage
    body: json
    endpoints:
      profile:
        path: /user/fetchBasicInfo.json
        body: json
      list:
        path: /torrent/fetchOpenTorrentList.json
        body: json
      dl:
        path: /torrent/generateDownloadKey.json
        body: json
        param: id
      hash:
        path: /torrent/fetchTorrentIdWithPiecesHash.json
        body: json
    dl_url: https://www.yemapt.org/api/torrent/download1?token={key}
    # ★ 5.7.0：JS 单页站 —— 首页 HTML 只有空壳，考核只能从后台接口读（带站点 cookie）
    exam_api:
      path: /api/user/profile
      field: examTask
      metrics:
        promotionUploadAmount: 上传增量
        promotionDownloadAmount: 下载增量
    note: 下载凭证 30 分钟有效；hrPunishEnable 为该站权威 H&R 标记
